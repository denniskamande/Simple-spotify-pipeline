name: 'spotify_dbt'
version: '1.0.0'
config-version: 2

profile: 'spotify_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Timezone used for hour-of-day / day-of-week analysis. Change to yours.
  local_timezone: 'Africa/Nairobi'

models:
  spotify_dbt:
    staging:
      +materialized: view
    marts:
      +materialized: view
